[package]
name = "gauges-track-analyzer"
version = "1.2.0"
description = "Gauge.S Track Analyzer"
authors = ["bimmerhead23"]
edition = "2021"

[lib]
name = "gauges_track_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
